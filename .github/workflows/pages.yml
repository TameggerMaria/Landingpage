# Vorschau: veröffentlicht die Seite bei jedem Push auf "main" über GitHub Pages.
# Einmalig aktivieren: Repo → Settings → Pages → Source: "GitHub Actions".
name: Vorschau (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Nur die öffentlichen Dateien veröffentlichen (keine Notizen wie CLAUDE.md)
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp *.html _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
